name: Fonctionnalité
description: Proposer une évolution
labels: [évolution]
body:
  - type: textarea
    id: besoin
    attributes: { label: Besoin }
    validations: { required: true }
  - type: textarea
    id: securite
    attributes: { label: Impact sur la sécurité et la vie privée }
    validations: { required: true }
  - type: dropdown
    id: phase
    attributes:
      label: Phase de la feuille de route
      options: ["Phase 2", "Phase 3", "Phase 4", "Phase 5", "Hors feuille de route"]
