# Une seule PR groupée par écosystème et par mois (mineures ET majeures),
# 5 PR ouvertes au maximum. Les alertes de sécurité Dependabot restent
# indépendantes de ce calendrier (paramètres du dépôt).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      rust:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns: ["*"]
