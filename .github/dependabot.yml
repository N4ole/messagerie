# Une SEULE PR par mois pour toutes les dépendances (Rust, npm, GitHub
# Actions, images Docker), grâce au groupe multi-écosystèmes « dependances ».
# Les mises à jour de sécurité Dependabot restent séparées et immédiates
# (comportement de GitHub, réglé dans les paramètres du dépôt).
version: 2

multi-ecosystem-groups:
  dependances:
    schedule:
      interval: monthly

updates:
  - package-ecosystem: cargo
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependances
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependances
    ignore:
      # typescript-eslint n'accepte pas encore TypeScript 7 (pair < 6.1).
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependances
  - package-ecosystem: docker
    directories: ["/deploy/docker", "/deploy/tor"]
    patterns: ["*"]
    multi-ecosystem-group: dependances
