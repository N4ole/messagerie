name: Release

# Déclenché par un tag de version (ex. v0.1.0).
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  windows:
    name: Construction Windows
    runs-on: windows-2022
    # L'environnement « release-signing » porte les secrets de signature
    # (Phase 5) et peut exiger une approbation manuelle.
    environment: release-signing
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.cert.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cohérence tag / versions
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $conf = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($tag -ne $conf -or $tag -ne $cargo) { throw "Tag $tag ≠ tauri.conf.json $conf / Cargo.toml $cargo" }
          "version=$tag" >> $env:GITHUB_OUTPUT
      - name: Chaîne Rust
        run: rustup toolchain install && rustup show
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:ui
      - run: cargo test --workspace --exclude msg-server --locked
      # Signature Authenticode, activée par la présence des secrets de
      # l'environnement « release-signing » (certificat PFX en Base64 et son
      # mot de passe). Le certificat est importé dans le magasin de
      # l'utilisateur ; signtool le désigne par son empreinte (aucun secret
      # sur la ligne de commande). Sans secrets : binaires non signés.
      - name: Certificat de signature
        id: cert
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64) { "signed=false" >> $env:GITHUB_OUTPUT; Write-Host "Aucun certificat : binaires non signés."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $pw = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          $c = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          $cmd = "`"$($signtool.FullName)`" sign /sha1 $($c.Thumbprint) /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 %1"
          $override = @{ bundle = @{ windows = @{ signCommand = $cmd } } } | ConvertTo-Json -Depth 5 -Compress
          Set-Content -Path (Join-Path $env:RUNNER_TEMP "signing.json") -Value $override
          "signed=true" >> $env:GITHUB_OUTPUT
          "signtool=$($signtool.FullName)" >> $env:GITHUB_OUTPUT
      - name: Construction (exécutable et installeurs)
        shell: pwsh
        run: |
          if ("${{ steps.cert.outputs.signed }}" -eq "true") {
            pnpm tauri build --config (Join-Path $env:RUNNER_TEMP "signing.json")
          } else {
            pnpm tauri build
          }
      - name: Regroupement
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/bundle/msi/*.msi "dist/Messagerie_${v}_x64_fr-FR.msi"
          Copy-Item target/release/bundle/nsis/*-setup.exe "dist/Messagerie_${v}_x64-setup.exe"
          Copy-Item target/release/messagerie.exe "dist/Messagerie_${v}_x64_portable.exe"
      - name: Vérification des signatures
        if: steps.cert.outputs.signed == 'true'
        shell: pwsh
        run: |
          Get-ChildItem dist/* | ForEach-Object {
            & "${{ steps.cert.outputs.signtool }}" verify /pa /v $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signature invalide : $($_.Name)" }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/

  publish:
    name: Publication
    needs: windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows
          path: dist
      - name: Sommes de contrôle SHA-256
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Attestation de provenance (SLSA, Sigstore)
        # Disponible pour les dépôts publics (ou GitHub Enterprise Cloud).
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Notes de version
        run: |
          cat > notes.md <<'NOTES'
          ## Vérification

          ```bash
          sha256sum -c SHA256SUMS
          gh attestation verify Messagerie_*_x64-setup.exe --repo ${{ github.repository }}
          ```

          Dans l'application : ⚙ Sécurité affiche l'état de la signature et l'empreinte SHA-256 de
          l'exécutable, à comparer avec `SHA256SUMS`.
          NOTES
          if [ "${{ needs.windows.outputs.signed }}" = "true" ]; then
            echo '> Binaires **signés (Authenticode)**, horodatés.' >> notes.md
          else
            echo '> **Binaires non signés (Authenticode)** : Windows SmartScreen affichera un avertissement. Vérifiez les empreintes et l'"'"'attestation ci-dessus.' >> notes.md
          fi
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          body_path: notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
