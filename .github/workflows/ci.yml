name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Aucune permission par défaut ; chaque job déclare le strict nécessaire.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS_WASM: --cfg getrandom_backend="wasm_js"

jobs:
  rust-linux:
    name: Rust (Linux) — fmt, clippy, tests, WASM
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dépendances système (WebKitGTK pour Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Chaîne Rust (rust-toolchain.toml)
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Construction de l'UI (embarquée par Tauri)
        run: pnpm build:ui
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests (unitaires + bout en bout avec PostgreSQL)
        run: cargo test --workspace --locked
      - name: Cœur client et crates partagées en WebAssembly
        run: RUSTFLAGS='${{ env.RUSTFLAGS_WASM }}' cargo build --locked --target wasm32-unknown-unknown -p msg-proto -p msg-crypto -p msg-markdown -p msg-media -p msg-kt -p msg-client-core -p msg-wasm

  rust-windows:
    name: Windows — tests + construction du .exe
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Chaîne Rust (rust-toolchain.toml)
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:ui
      - name: Tests (hors serveur ; inclut DPAPI réel)
        run: cargo test --workspace --exclude msg-server --locked
      - run: cargo clippy -p msg-platform-win -p messagerie-desktop --all-targets --locked -- -D warnings
      - name: Construction des installeurs (MSI + NSIS) et de l'exécutable
        run: pnpm tauri build
      - name: Regroupement des artefacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/bundle/msi/*.msi dist/
          Copy-Item target/release/bundle/nsis/*-setup.exe dist/
          Copy-Item target/release/messagerie.exe dist/Messagerie_portable_x64.exe
          Get-ChildItem dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: messagerie-windows-non-signe
          path: dist/
          retention-days: 7

  deploy:
    name: Déploiement — Helm, sauvegarde et reprise
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Outils (age, client PostgreSQL)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends age postgresql-client
      - name: Chaîne Rust (rust-toolchain.toml)
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked -p msg-server
      - name: Exercice de reprise (sauvegarde chiffrée → restauration vérifiée)
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          MSG_SERVER_BIN: ${{ github.workspace }}/target/debug/msg-server
        run: sh deploy/backup/test-restore.sh
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: kubeconform (empreinte vérifiée)
        run: |
          curl -sSfLo /tmp/kc.tgz https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          echo "c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3  /tmp/kc.tgz" | sha256sum -c
          tar -xzf /tmp/kc.tgz -C /usr/local/bin kubeconform
      - name: Chart Helm (lint + validation des manifestes, CRD comprises)
        run: |
          helm lint deploy/helm/messagerie
          helm template t deploy/helm/messagerie --kube-version 1.31.0 -f deploy/helm/messagerie/ci-values.yaml > /tmp/all.yaml
          helm template t deploy/helm/messagerie --kube-version 1.31.0 > /tmp/default.yaml
          kubeconform -strict -summary -kubernetes-version 1.31.0 -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/all.yaml /tmp/default.yaml
      - name: Systemd (unités)
        run: |
          sudo install -m 0755 target/debug/msg-server /usr/local/bin/msg-server
          systemd-analyze verify --man=no deploy/vm/msg-server@.service deploy/vm/msg-server-backup.timer
      - name: Règles Prometheus
        run: |
          docker run --rm -v "$PWD/deploy/monitoring:/m:ro" --entrypoint promtool prom/prometheus:v3.5.0 check rules /m/alerts.yml

  zap:
    name: Scan ZAP de l'API (actif)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Chaîne Rust (rust-toolchain.toml)
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked -p msg-server
      - name: Serveur réel
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          MSG_SITE_NAME: zap.example
        run: |
          MSG_SERVER_SECRET=$(openssl rand -hex 32) nohup target/debug/msg-server serve --bind 127.0.0.1:18080 > server.log 2>&1 &
          timeout 60 sh -c 'until curl -sf http://127.0.0.1:18080/v1/health > /dev/null; do sleep 1; done'
      - name: ZAP — scan actif à partir de la description OpenAPI (échec au moindre avertissement)
        run: |
          mkdir -m 777 zap
          sed 's#http://127.0.0.1:8080#http://127.0.0.1:18080#' docs/api/openapi.yaml > zap/openapi.yaml
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" zaproxy/zap-stable@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af \
            zap-api-scan.py -t /zap/wrk/openapi.yaml -f openapi -r rapport.html -J rapport.json
      - name: Aucune erreur serveur ni panique pendant le scan
        run: |
          sed 's/\x1b\[[0-9;]*m//g' server.log | grep -o 'status=[0-9]*' | sort | uniq -c
          ! sed 's/\x1b\[[0-9;]*m//g' server.log | grep -E 'status=5[0-9][0-9]|panicked'
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-zap
          path: zap/rapport.*
          retention-days: 30

  interop:
    name: Interopérabilité desktop ↔ web (Chromium)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Chaîne Rust (rust-toolchain.toml)
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: interop
      - name: wasm-bindgen (version identique à Cargo.lock)
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Client web (WASM + interface)
        run: pnpm build:web
      - name: Serveur et client natif de test
        run: cargo build --locked -p msg-server --bin msg-server --example interop_peer
      - name: Chromium pour Playwright
        run: pnpm --filter @messagerie/interop exec playwright install --with-deps chromium
      - name: Desktop (natif) ↔ web (WASM dans Chromium)
        run: pnpm test:interop

  tor-real:
    name: Tor réel (amorçage arti, informatif)
    runs-on: ubuntu-24.04
    # Dépend du réseau Tor public : n'empêche pas la fusion en cas d'échec.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Chaîne Rust (rust-toolchain.toml)
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: tor
      - name: Amorçage réel de Tor par arti
        run: cargo test --locked -p msg-tor -- --ignored

  frontend:
    name: UI — typecheck, lint, tests, build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build:ui

  audit:
    name: Audit des dépendances
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cargo-deny (vulnérabilités, licences, sources)
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check advisories bans licenses sources
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: pnpm audit (dépendances de production)
        run: pnpm audit --prod --audit-level high
