# Fuzzing des parseurs exposés à des données non fiables (cargo-fuzz,
# libFuzzer). Hors du workspace principal : exige une chaîne nightly.
#   cargo +nightly fuzz run <cible> -- -max_total_time=60
[package]
name = "msg-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
msg-proto = { path = "../crates/msg-proto" }
msg-crypto = { path = "../crates/msg-crypto" }
msg-markdown = { path = "../crates/msg-markdown" }
msg-media = { path = "../crates/msg-media" }
msg-kt = { path = "../crates/msg-kt" }
serde_json = "1"
uuid = "1"
tokio = { version = "1", features = ["rt"] }

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "markdown"
path = "fuzz_targets/markdown.rs"
test = false
doc = false
bench = false

[[bin]]
name = "media"
path = "fuzz_targets/media.rs"
test = false
doc = false
bench = false

[[bin]]
name = "app_message"
path = "fuzz_targets/app_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mls_incoming"
path = "fuzz_targets/mls_incoming.rs"
test = false
doc = false
bench = false

[[bin]]
name = "api_json"
path = "fuzz_targets/api_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "key_transparency"
path = "fuzz_targets/key_transparency.rs"
test = false
doc = false
bench = false

[[bin]]
name = "signatures"
path = "fuzz_targets/signatures.rs"
test = false
doc = false
bench = false

[[bin]]
name = "documents"
path = "fuzz_targets/documents.rs"
test = false
doc = false
bench = false
