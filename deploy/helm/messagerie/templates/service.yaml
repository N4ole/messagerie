apiVersion: v1
kind: Service
metadata:
  name: {{ include "messagerie.fullname" . }}
  labels: {{- include "messagerie.labels" . | nindent 4 }}
spec:
  selector: {{- include "messagerie.selector" . | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http }
---
{{- if .Values.metrics.enabled }}
# Service séparé : les métriques ne passent jamais par l'Ingress.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "messagerie.fullname" . }}-metrics
  labels:
    {{- include "messagerie.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  selector: {{- include "messagerie.selector" . | nindent 4 }}
  ports:
    - { name: metrics, port: {{ .Values.metrics.port }}, targetPort: metrics }
{{- end }}
