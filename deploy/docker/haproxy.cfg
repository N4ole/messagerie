# HAProxy : terminaison TLS et répartition entre les instances du serveur.
# Aucune journalisation (pas d'adresse IP conservée) ; la table de débit
# par IP reste en mémoire (limitation d'abus), jamais écrite.
global
    # ≈ 2 descripteurs par connexion : relever `ulimits.nofile` avant d'augmenter.
    maxconn 8000
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
    ssl-default-bind-ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305

# DNS interne de Docker : les instances absentes au démarrage ou recréées
# sont résolues dynamiquement.
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

defaults
    mode http
    option http-server-close
    # Perte d'une instance : une connexion qui échoue (avant tout envoi de
    # la requête, donc sans risque de double traitement) est retentée sur
    # une autre instance, sans attendre que les contrôles la déclarent DOWN.
    retries 3
    option redispatch 1
    timeout connect 2s
    timeout client 60s
    timeout server 60s
    # WebSocket : connexions longues.
    timeout tunnel 1h
    timeout http-request 10s

frontend https
    bind :8443 ssl crt /run/secrets/tls.pem alpn h2,http/1.1
    bind :8080
    http-request redirect scheme https code 301 unless { ssl_fc }
    stick-table type ipv6 size 100k expire 60s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 300 }
    http-response set-header Strict-Transport-Security "max-age=63072000; includeSubDomains"
    # Les métriques ne sont jamais exposées publiquement.
    http-request deny deny_status 404 if { path_beg /metrics }
    default_backend servers

backend servers
    balance leastconn
    option httpchk GET /v1/health
    http-check expect status 200
    # Une instance qui refuse les connexions est écartée aussitôt.
    default-server inter 2s fall 2 rise 2 check observe layer4 error-limit 1 on-error mark-down resolvers docker init-addr last,libc,none
    server s1 server-1:8080
    server s2 server-2:8080
