[workspace]
resolver = "2"
members = [
    "crates/msg-proto",
    "crates/msg-crypto",
    "crates/msg-markdown",
    "crates/msg-client-core",
    "crates/msg-platform-win",
    "server/msg-server",
    "server/msg-admin",
    "apps/desktop/src-tauri",
]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/N4ole/messagerie"
rust-version = "1.85"
publish = false

[workspace.dependencies]
msg-proto = { path = "crates/msg-proto" }
msg-crypto = { path = "crates/msg-crypto" }
msg-markdown = { path = "crates/msg-markdown" }
msg-client-core = { path = "crates/msg-client-core" }
msg-platform-win = { path = "crates/msg-platform-win" }

anyhow = "1"
argon2 = { version = "0.5", features = ["std", "zeroize"] }
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std"] }
clap = { version = "4.5", features = ["derive", "env"] }
ed25519-dalek = { version = "2.2", features = ["zeroize"] }
futures-util = "0.3"
getrandom = "0.3"
hex = "0.4"
openmls = { version = "0.9", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_basic_credential = "0.6"
openmls_memory_storage = "0.6"
openmls_rust_crypto = { version = "0.6", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_traits = { version = "0.6", features = ["draft-ietf-mls-pq-ciphersuites"] }
pulldown-cmark = { version = "0.13", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1.47", features = ["full"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
totp-rs = { version = "5.7", features = ["otpauth"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1.8", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
