[package]
name = "msg-server"
description = "Serveur de messagerie : authentification, annuaire de clés, distribution de blobs chiffrés."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "msg-server"
path = "src/main.rs"

[dependencies]
msg-proto.workspace = true
msg-crypto.workspace = true
anyhow.workspace = true
argon2.workspace = true
axum = { version = "0.8", features = ["ws", "macros"] }
base64.workspace = true
chacha20poly1305.workspace = true
clap.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hex.workspace = true
hkdf = "0.12"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "migrate", "macros"] }
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
totp-rs.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
msg-client-core.workspace = true
reqwest.workspace = true
tempfile = "3"
url = "2"
