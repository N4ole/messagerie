[package]
name = "msg-tor"
description = "Transport Tor embarqué (arti) : proxy SOCKS5 local authentifié, mode strict sans repli en clair."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arti-client = { version = "0.48", default-features = false, features = ["tokio", "rustls", "onion-service-client", "compression"] }
async-trait = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tor-rtcompat = { version = "0.48", default-features = false }
hex.workspace = true
msg-crypto.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
zeroize.workspace = true
