[package]
name = "msg-client-core"
description = "Logique client : API signée, base locale chiffrée (SQLCipher), conversations MLS."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
msg-proto.workspace = true
msg-crypto.workspace = true
msg-markdown.workspace = true
msg-platform-win.workspace = true
msg-media.workspace = true
msg-kt.workspace = true
base64.workspace = true
futures-util.workspace = true
hex.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
url = "2"
uuid.workspace = true
zeroize.workspace = true
p256 = { version = "0.14", features = ["ecdsa"], optional = true }
ciborium = { version = "0.2", optional = true }
sha2 = { workspace = true, optional = true }

[features]
# Authentificateur FIDO2 logiciel, pour les tests uniquement.
soft-authenticator = ["dep:p256", "dep:ciborium", "dep:sha2"]

[dev-dependencies]
p256 = { version = "0.14", features = ["ecdsa"] }
ciborium = "0.2"
sha2.workspace = true
tempfile = "3"
