[package]
name = "msg-wasm"
description = "Client web : liaisons wasm-bindgen du cœur client (même code cryptographique que le desktop)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Tout le code est réservé à la cible wasm32 : sur les autres cibles, le
# crate est vide (il reste membre du workspace pour fmt/clippy).
[target.'cfg(target_arch = "wasm32")'.dependencies]
msg-client-core.workspace = true
msg-crypto.workspace = true
msg-proto.workspace = true
base64.workspace = true
futures-util.workspace = true
js-sys = "0.3"
qrcode = { version = "0.15", default-features = false, features = ["svg"] }
serde.workspace = true
serde-wasm-bindgen = "0.6"
uuid.workspace = true
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
