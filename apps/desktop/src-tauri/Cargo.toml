[package]
name = "messagerie-desktop"
description = "Application de bureau (Tauri v2). Les clés restent dans ce processus Rust ; la WebView n'en voit aucune."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "messagerie_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "messagerie"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
msg-client-core.workspace = true
msg-platform-win.workspace = true
msg-proto.workspace = true
base64.workspace = true
futures-util.workspace = true
qrcode = { version = "0.15", default-features = false, features = ["svg"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2.8"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
